# Cotygodniowe propozycje aktualizacji zależności (osobne PR-y; nic nie scala się samo).
# PHP nie ma bibliotek zewnętrznych (composer.json wymaga tylko rozszerzeń), a biblioteki JS
# wgrane do repozytorium są opisane w THIRD-PARTY.md i aktualizowane ręcznie.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /agent-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
