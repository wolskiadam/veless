# Document root = public/ (jak na hostingu). .env, src/, config/ są poza zasięgiem przeglądarki.
<VirtualHost *:80>
    DocumentRoot /var/www/crm/public
    <Directory /var/www/crm/public>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
